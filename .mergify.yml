---
pull_request_rules:
  - name: automatic merge
    conditions:
      - and: &base_checks
        - base=main
        - -label~=^acceptance-tests-needed|not-ready
        - '-check-failure ~= ^(?!(Rule:|Mergify|Summary))'
        - '-check-pending ~= ^(?!(Rule:|Mergify|Summary))'
        - check-success=only-test
        - check-success=checkstyle-perl
        - check-success=checkstyle-npm
        - linear-history
      - and:
        - "#approved-reviews-by>=2"
        - "#changes-requested-reviews-by=0"
    actions: &merge
      merge:
        method: fast-forward
  - name: automatic merge on special label
    conditions:
      - and: *base_checks
      - and:
        # mergify config checks needs at least two rules in "and" so we repeat
        # one from the base checks
        - base=main
        - "label=merge-fast"
    actions: *merge
  - name: automatic merge for dependabot updates that only bump dependencies
    conditions:
      - and: *base_checks
      - and: &bot_gate
          - author=dependabot[bot]
          - "#changes-requested-reviews-by=0"
      # A commit pushed on top of the bot's own is a code change, not a bump
      - "#commits=1"
      # A bump writes manifests and action revisions only; a hand edit inside
      # the bot's own commit still passes, which this config does not cover
      - -files~=^(?!(package\.json|package-lock\.json|\.github/workflows/[^/]+\.ya?ml)$).+
    actions: *merge
  - name: require review for other dependabot updates
    conditions:
      # One approval, not the base rule's two: the reviewer has to see the code
      # change riding along, not re-review the bump
      - and: *base_checks
      - and: *bot_gate
      - "#approved-reviews-by>=1"
    actions: *merge
  # dependabot only rebases on conflicts, not when merely behind main
  - name: rebase green dependabot updates behind main
    conditions:
      - and: *base_checks
      - and:
        - author=dependabot[bot]
        - "#commits-behind>0"
    actions: &rebase
      rebase:
        bot_account: suse-qe-tools-mergify
  - name: continuously rebase pull requests when it's labeled with `rebase`
    conditions:
      - label=rebase
    actions: *rebase

---
name: security audits
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'main'
    paths:
      - 'cpanfile'
      - 'package.json'
      - 'package-lock.json'
      - 'Makefile'
      - '.github/workflows/audits.yml'
  schedule:
    - cron: '0 3 * * *' # Every day at 3 AM UTC

permissions:
  contents: read

jobs:
  audit-perl:
    runs-on: ubuntu-latest
    container:
      image: perl:5.42
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: cpanm -n CPAN::Audit
      - name: Run CPAN audit
        id: audit
        shell: bash
        run: set -o pipefail; make check-audits-cpan | tee cpan-findings.txt
        continue-on-error: true
      - name: Report result as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ steps.audit.outcome }}" in
            success) script/audit-issue perl clean cpan-findings.txt "$RUN_URL" ;;
            failure) script/audit-issue perl findings cpan-findings.txt "$RUN_URL" ;;
            *) echo "audit outcome ${{ steps.audit.outcome }}: no issue update" ;;
          esac
      - name: Fail on unwaived advisories
        if: steps.audit.outcome != 'success'
        run: exit 1

  audit-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: make install-deps-js
      - name: Run NPM audit
        id: audit
        shell: bash
        run: set -o pipefail; make check-audits-npm | tee npm-findings.txt
        continue-on-error: true
      - name: Report result as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ steps.audit.outcome }}" in
            success) script/audit-issue npm clean npm-findings.txt "$RUN_URL" ;;
            failure) script/audit-issue npm findings npm-findings.txt "$RUN_URL" ;;
            *) echo "audit outcome ${{ steps.audit.outcome }}: no issue update" ;;
          esac
      - name: Fail on unwaived advisories
        if: steps.audit.outcome != 'success'
        run: exit 1
